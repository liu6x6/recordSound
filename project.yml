name: VoiceScribe
options:
  bundleIdPrefix: com.voicescribe
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: ZH6TQH466Q
    PRODUCT_BUNDLE_IDENTIFIER: com.voicescribe.app
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.5.0"

packages:
  CoreModels:
    path: Packages/CoreModels
  AudioKit:
    path: Packages/AudioKit
  TranscriptionKit:
    path: Packages/TranscriptionKit
  SummarizationKit:
    path: Packages/SummarizationKit

targets:
  VoiceScribe:
    type: application
    platform: macOS
    dependencies:
      - package: CoreModels
      - package: AudioKit
      - package: TranscriptionKit
      - package: SummarizationKit
    sources:
      - path: App
      - path: Features
      - path: MenuBar
      - path: Support
    info:
      path: App/Info.plist
      properties:
        CFBundleName: VoiceScribe
        CFBundleDisplayName: VoiceScribe
        CFBundleIdentifier: com.voicescribe.app
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: "VoiceScribe 需要访问麦克风以录制您的声音。"
        NSSpeechRecognitionUsageDescription: "VoiceScribe 使用设备端语音识别将录音实时转写为文字，数据不会离开您的设备。"
        NSHumanReadableCopyright: "© 2026 VoiceScribe"
    entitlements:
      path: App/VoiceScribe.entitlements
      properties:
        com.apple.security.device.audio-input: true
